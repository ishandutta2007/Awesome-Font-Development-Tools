<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070a13"/><stop offset="50%" stop-color="#0c1222"/><stop offset="100%" stop-color="#0a0f1d"/></linearGradient><radialGradient id="glow-violet" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="glow-cyan" cx="80%" cy="70%" r="55%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".25"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="glow-accent" cx="50%" cy="50%" r="40%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".18"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient><linearGradient id="accent-text" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="bezier-stroke" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".9"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".8"/></linearGradient><filter id="shadow-drop" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".6" stdDeviation="8"/></filter><filter id="glow-filter" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse-orb{0%{transform:scale(1) translate(0,0);opacity:.8}50%{transform:scale(1.15) translate(-15px,10px);opacity:1}}@keyframes draw-path{0%{stroke-dashoffset:2000}50%{stroke-dashoffset:0}}@keyframes float-pill-1{0%{transform:translateY(0)}50%{transform:tran