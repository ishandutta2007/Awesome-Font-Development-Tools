<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Radial Glow Gradients -->
    <radialGradient id="glow-violet" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-accent" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="accent-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="bezier-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <filter id="shadow-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-orb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.8; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 1; }
    }
    @keyframes draw-path {
      0% { stroke-dashoffset: 2000; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -2000; }
    }
    @keyframes float-pill-1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes float-pill-2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes handle-wobble {
      0%, 100% { transform: rotate(0deg); transform-origin: 320px 240px; }
      50% { transform: rotate(8deg); transform-origin: 320px 240px; }
    }
    @keyframes handle-wobble-2 {
      0%, 100% { transform: rotate(0deg); transform-origin: 880px 160px; }
      50% { transform: rotate(-10deg); transform-origin: 880px 160px; }
    }
    .orb-1 { animation: pulse-orb 8s ease-in-out infinite; }
    .orb-2 { animation: pulse-orb 10s ease-in-out infinite reverse; }
    .bezier-animated {
      stroke-dasharray: 2000;
      animation: draw-path 16s linear infinite;
    }
    .pill-anim-1 { animation: float-pill-1 5s ease-in-out infinite; }
    .pill-anim-2 { animation: float-pill-2 6s ease-in-out infinite; }
    .handle-group-1 { animation: handle-wobble 7s ease-in-out infinite; }
    .handle-group-2 { animation: handle-wobble-2 8s ease-in-out infinite; }
    .grid-line { stroke: #1e293b; stroke-opacity: 0.35; stroke-width: 1; }
    .metric-line { stroke: #334155; stroke-dasharray: 4,4; stroke-width: 1; stroke-opacity: 0.6; }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
      letter-spacing: 0.3px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Glowing Auras -->
  <circle cx="220" cy="140" r="280" fill="url(#glow-violet)" class="orb-1" />
  <circle cx="980" cy="260" r="300" fill="url(#glow-cyan)" class="orb-2" />
  <circle cx="600" cy="200" r="220" fill="url(#glow-accent)" class="orb-1" />

  <!-- Typographic Grid & Metric Guidelines -->
  <g opacity="0.75">
    <!-- Grid -->
    <line x1="100" y1="0" x2="100" y2="400" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="400" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="400" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="400" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="400" class="grid-line" />

    <!-- Metric Lines (Ascender, Cap-Height, x-Height, Baseline, Descender) -->
    <line x1="60" y1="65" x2="1140" y2="65" class="metric-line" />
    <text x="70" y="60" fill="#64748b" font-size="10" font-family="monospace">ASCENDER: 800</text>
    
    <line x1="60" y1="335" x2="1140" y2="335" class="metric-line" />
    <text x="70" y="330" fill="#64748b" font-size="10" font-family="monospace">BASELINE: 0</text>
  </g>

  <!-- Background Dynamic Bézier Spline Curves -->
  <path d="M 50 310 C 220 330, 260 80, 480 120 C 700 160, 750 340, 950 280 C 1050 250, 1120 180, 1160 140" 
        fill="none" stroke="url(#bezier-stroke)" stroke-width="3" filter="url(#glow-filter)" class="bezier-animated" />

  <path d="M 80 180 C 300 110, 420 330, 680 290 C 900 260, 980 90, 1150 120" 
        fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,6" />

  <!-- Interactive Bézier Vector Anchor Points & Tangent Handles -->
  <g class="handle-group-1">
    <line x1="260" y1="210" x2="380" y2="270" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.7" />
    <circle cx="260" cy="210" r="4" fill="#f43f5e" />
    <circle cx="380" cy="270" r="4" fill="#f43f5e" />
    <rect x="314" y="234" width="12" height="12" rx="2" fill="#ffffff" stroke="#e11d48" stroke-width="2" />
  </g>

  <g class="handle-group-2">
    <line x1="820" y1="185" x2="940" y2="135" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.7" />
    <circle cx="820" cy="185" r="4" fill="#06b6d4" />
    <circle cx="940" cy="135" r="4" fill="#06b6d4" />
    <rect x="874" y="154" width="12" height="12" rx="2" fill="#ffffff" stroke="#0891b2" stroke-width="2" />
  </g>

  <!-- Giant Stylized Glyph Outline in Background (Letter 'A' & 'f') -->
  <g opacity="0.07" transform="translate(100, 20)">
    <path d="M 150 320 L 220 80 L 270 80 L 340 320 L 290 320 L 275 260 L 215 260 L 200 320 Z M 225 220 L 265 220 L 245 140 Z" fill="#ffffff" />
  </g>
  <g opacity="0.08" transform="translate(860, 30)">
    <path d="M 120 70 C 90 70 70 90 70 120 L 70 160 L 40 160 L 40 195 L 70 195 L 70 320 L 110 320 L 110 195 L 145 195 L 145 160 L 110 160 L 110 125 C 110 110 115 105 130 105 L 145 105 L 145 70 Z" fill="#ffffff" />
  </g>

  <!-- Dynamic Floating Feature Pills -->
  <g class="pill-anim-1" transform="translate(80, 75)">
    <rect width="130" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#3b82f6" />
    <text x="28" y="19" fill="#93c5fd" class="badge-text">VARIABLE FONTS</text>
  </g>

  <g class="pill-anim-2" transform="translate(980, 75)">
    <rect width="135" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#a855f7" />
    <text x="28" y="19" fill="#d8b4fe" class="badge-text">OTF / TTF / WOFF2</text>
  </g>

  <g class="pill-anim-2" transform="translate(85, 305)">
    <rect width="135" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#10b981" />
    <text x="28" y="19" fill="#6ee7b7" class="badge-text">PYTHON PIPELINES</text>
  </g>

  <g class="pill-anim-1" transform="translate(975, 305)">
    <rect width="145" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#f43f5e" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#f43f5e" />
    <text x="28" y="19" fill="#fda4af" class="badge-text">OPENTYPE SHAPING</text>
  </g>

  <!-- Foreground Central Shield / Backdrop for Uncompromising Contrast & Legibility -->
  <g filter="url(#shadow-drop)">
    <!-- Protective Backdrop: Keeps text perfectly clear and in foreground -->
    <rect x="180" y="105" width="840" height="185" rx="20" 
          fill="#0a0f1d" fill-opacity="0.88" 
          stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />
    
    <!-- Inner Accent Top Border -->
    <rect x="230" y="105" width="740" height="2" fill="url(#accent-text)" />
  </g>

  <!-- Foreground Typography & Branding (Top Z-Index) -->
  <g>
    <!-- Category Pill -->
    <rect x="495" y="125" width="210" height="26" rx="13" 
          fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="600" y="142" text-anchor="middle" fill="#a5b4fc" class="badge-text" font-size="11">
      TYPE DESIGN &amp; FONT ENGINEERING
    </text>

    <!-- Main Title -->
    <text x="600" y="198" text-anchor="middle" class="text-title" filter="url(#shadow-drop)">
      Awesome Font Development Tools
    </text>

    <!-- Subtitle -->
    <text x="600" y="240" text-anchor="middle" class="text-subtitle">
      Curated Ecosystem of SaaS Suites, Open-Source Editors, Compilers &amp; Toolchains
    </text>

    <!-- Version & Tag Indicator -->
    <text x="600" y="270" text-anchor="middle" fill="#64748b" font-size="12" font-family="monospace">
      Bézier Outlines • Variable Axes • HarfBuzz • fontTools • AFDKO • Web Fonts
    </text>
  </g>
</svg>